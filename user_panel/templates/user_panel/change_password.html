{% extends 'shared/_layot.html' %}
{% block title %}User Panel{% endblock  %}
{% load static %}

{% block content %}

<div class="container">
    <div class="row">
        <div class="col-md-4">
            {% include 'user_panel/user_panel_menu_component.html' %}
        </div>

        <div class="col-md-8">
            <form action="" method="post" enctype="multipart/form-data">
                <p>
                    {% csrf_token %}
                </p>
                
                <p>
                    {{form.current_password}}
                </p>

                <p>
                    {{form.new_password}}
                </p>
                
                <p>
                    {{form.confirm_new_password}}
                </p>

                <p class= "alert">
                    {{errors}}
                </p>
                    <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>
</div>



{% endblock  %}
